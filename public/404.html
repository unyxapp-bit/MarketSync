<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <title>marketsync</title>
    <script>
      // GitHub Pages has no server-side rewrite for a client-side router: a direct load or
      // refresh on any route other than "/" (e.g. /MarketSync/app/schedules) hits this 404 page
      // instead of index.html. This is the standard spa-github-pages redirect
      // (https://github.com/rafgraph/spa-github-pages): encode the real path into the query
      // string of a redirect back to the app root, where index.html's inline script below
      // decodes it and hands the real URL to react-router via history.replaceState.
      var pathSegmentsToKeep = 1 // "/MarketSync"
      var l = window.location
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
        l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      )
    </script>
  </head>
  <body></body>
</html>
